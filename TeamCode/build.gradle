apply plugin: 'com.android.application'
apply plugin: 'kotlin-android' // Enables Kotlin compilation and kotlinOptions block
apply plugin: 'kotlin-kapt'
// Pull in everything from your shared dependency configuration script
apply from: '../build.dependencies.gradle'
apply from: '../build.common.gradle'

android {
    namespace 'org.firstinspires.ftc.teamcode'
    compileSdk 34

    defaultConfig {
        multiDexEnabled true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation project(':FtcRobotController')
}

// FIX: This replaces the deprecated kotlinOptions block and clears the strikethrough warnings
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
        freeCompilerArgs.addAll([
                "-Xbackend-threads=0",
                "-Xno-param-assertions"
        ])
    }
}