# yaml-language-server: $schema=generated/config-schema.json
#
# BIOBUZZ (2026-2027) robot configuration. Field geometry is from Competition Manual TU05
# (Section 9) and the official field CAD; every pose and zone is written in the RED alliance's
# Pedro frame and BLUE is derived by the field's 180-degree rotational symmetry ("m" values).
#
# Pedro frame used throughout: origin at the field corner where the audience wall meets the RED
# alliance wall, +x toward the BLUE alliance wall, +y away from the audience, heading 0 = +x,
# counter-clockwise positive. The RED alliance side is x < field.size_in / 2.
meta:
  # ConfigLoader ignores an ADB-pushed override whose season differs (or is missing), so a
  # DECODE config.yaml left on the Control Hub can never silently replace BIOBUZZ values.
  season: "biobuzz"

field:
  # Inside-wall field width. The manual says "approximately 144 in"; the official CAD's inner
  # perimeter is ~141.3 in and the team's measured DECODE mirror axis was 70.75 (141.5 field).
  size_in: 141.5
  hive:
    center_to_center_in: 25.5
    pivot_height_in: 43.95
    up_opening_offset_in: 15.69
    up_opening_height_in: 59.56
    down_opening_offset_in: 21.36
    down_opening_height_in: 38.17
    frame_width_in: 49.46
    frame_depth_in: 38.95
    bottom_height_in: 30.6
  # Zone tape from the official field CAD: the RED LOADING ZONE runs from 23.91 in past the
  # field centre for 22.69 in along the RED wall, 11 in deep; the GARDEN is 22.69 x 2 in.
  loading_zone:
    start_y_in: 94.66
    width_in: 22.69
    depth_in: 11.0
  garden:
    length_in: 22.69
    depth_in: 2.0
  # FLOWER top-ring centre from the official field CAD.
  flower:
    wall_offset_in: 2.65
    corner_offset_in: 47.36

hive:
  # A CELL whose opening centre is above this height is upward-facing. Upward openings sit at
  # ~59.6 in and downward ones at ~38.2 in, so the midpoint leaves ~10 in of margin either way.
  up_height_threshold_in: 48.9
  confirm_frames_count: 3
  settle_ms: 1500
  max_observation_age_ms: 400

match:
  auto_ms: 30000
  teleop_ms: 120000
  flower_unlock_remaining_ms: 60000
  # TELEOP time remaining at which the park alert starts watching the drive time to park.
  final_warning_remaining_ms: 20000

inventory:
  # G407: a ROBOT may not CONTROL more than 4 SCORING ELEMENTS at a time.
  capacity_count: 4
  preload_count: 4
  entry_sensor_enabled: false
  entry_sensor_name: "intakeBeam"
  entry_sensor_active_low: true
  entry_debounce_ms: 40

pedro:
  localization:
    x_pod_offset: 0.8827159160704124
    y_pod_offset: -5.46341422974594

  heading:
    pid:
      p: 4.268315397151918
      i: 0.0
      d: 0.0
    ks: 0.0

  translation:
    gain_threshold: 2.5
    forward:
      small_error_pid:
        p: 0.11404309007001973
        i: 0.0
        d: 0.0
      large_error_pid:
        p: 0.3086639721874311
        i: 0.0
        d: 0.0
    strafe:
      small_error_pid:
        p: 0.14363321035423612
        i: 0.0
        d: 0.0
      large_error_pid:
        p: 0.3887512800534528
        i: 0.0
        d: 0.0

  feedforward:
    coast_kv: 0.012572883790573407
    brake_kv: 0.010686951221987396

  braking:
    forward:
      linear: 0.09843454130209381
      quadratic: 0.0015787148084173775
    strafe:
      linear: 0.03541604034426723
      quadratic: 0.0021434483056786057
    heading:
      linear: 0.053255031895873425
      quadratic: 0.003792767934047215

  motion:
    # Recheck on robot: this recovered forward velocity is unusually low (inches/second).
    max_forward_velocity: 79.9698860197901
    max_strafe_velocity: 64.77428818716172
    natural_forward_deceleration: 38.68031215213687
    natural_strafe_deceleration: 60.92227329307563
    # Explicit speed fraction; the old v2 PathConstraints 0.90 was a completion threshold.
    max_path_speed: 0.9

turret:
  enabled: true
  max_power_output: 0.5
  servo_direction_inverted: false
  ks_positive: 0.0009
  ks_negative: 0.0663
  orientation:
    logo: "LEFT"
    usb: "UP"
  travel:
    min_angle: -26.5
    max_angle: 26.5
  stall:
    enabled: true
    power_threshold: 0.12
    min_progress_deg: 0.75
    timeout_sec: 0.35
    # A stall fault cuts power, then clears itself after this long (0 = latch until restart).
    retry_after_sec: 1.0
  runaway:
    enabled: false
    divergence_deg: 8.0
  pidf:
    p: 0.02
    i: 0.008
    d: 0.0
    f: 0.0
  # Feedforward (power per deg/s) for the turret rate the chassis motion demands: 1 / K from the
  # Turret Plant Calibration OpMode (K = deg/s per unit power). Without it the turret lags ~10 deg
  # behind a chassis turning at 30 deg/s. 0 disables; measure K before enabling.
  kv: 0.0
  # Chassis-driven turret rates below this (deg/s) are odometry noise: no feedforward.
  ff_min_rate_dps: 3.0
  # Turret axis position relative to the robot centre. Bearings and shot distances are measured
  # from here; at BIOBUZZ ranges a 4 in offset is a 6-9 deg aim error.
  pivot_forward_in: 0.0
  pivot_left_in: 0.0
  # Clamped I term (pidf.i is its gain). It is reset on settling, at a travel stop and whenever
  # the loop restarts, so idle time and long slews can no longer wind it up.
  integral:
    band_deg: 30.0
    limit_power: 0.08
  tolerance:
    # Total lateral miss (in) allowed at the CELL opening. The opening is 20 in wide (~15 in seen
    # 40 deg off-axis) and a NECTAR is 3.6 in, so 8 in leaves margin either side.
    max_drift: 8
    near_cutoff: 1
    near_val: 1.5
    min_deg: 0.5
    max_deg: 4
    # Once settled, the turret is left alone until the error exceeds tolerance * exit_factor.
    exit_factor: 1.5
  analog_encoder:
    enabled: true
    zero_voltage: 1.2650
    degrees_per_volt: 42.15
    min_voltage: 0.556
    max_voltage: 1.964
    full_scale_voltage: 3.3
    inverted: true

vision:
  enabled: true
  # Stream continuously so the HIVE tracker sees every TIP; false streams only while relocalizing.
  continuous: true
  camera_name: "Webcam 1"
  decimation: 3
  # Camera extrinsics in the robot frame. BIOBUZZ AprilTags are on the bottoms of CELLS 30-60 in
  # above the TILES, so the camera must be pitched up; measure and replace these on the robot.
  camera:
    forward_in: 3.54
    left_in: 4.72
    height_in: 7.68
    yaw_deg: 0.0
    pitch_up_deg: 50.0
  relocalize:
    max_range_in: 72.0
    max_correction_in: 18.0

sentinel:
  robot_width: 18
  rotation_lookahead_time: 0.0685
  # true: the whole HIVE frame base is a no-drive zone (the robot never passes under the HIVE).
  # false: only the two 2 in foot bars are protected, for a robot built to drive under the HIVE.
  # Such a robot must stay below field.hive.bottom_height_in and clear the A-frame legs, which
  # lean inward from the feet toward the pivots (official CAD) and are not modelled here.
  protect_full_hive_footprint: true
  frame_base_width_in: 2.0
  center_line_margin_in: 0.25
  wall_contact_tolerance_in: 0.5
  park_lane_margin_in: 3.0
  route_sample_step: 0.005
  # Conservative drive-time estimate for a park route: a trapezoidal profile from pedro.motion,
  # this turn rate and a settle per waypoint. Used by the TeleOp park alert and the AUTO tests.
  park_turn_rate_dps: 180.0
  park_settle_per_waypoint_sec: 0.25
  geometry_epsilon_in: 0.000000001

casablanca:
  enable_depth_protection: true
  enable_side_protection: true
  repulsion:
    power: 0.12
    decel_safety_factor: 0.7
  depth:
    slow_down: 8.0
    hard_stop: 2.5
  side:
    slow_down: 8.0
    hard_stop: 2.5
  lane_blend_distance: 12
  friction:
    x: 0.1041
    y: 0.1488
    rot: 0.1041
  smoothing:
    teleop_enabled: true
    auto_enabled: false
    # Seconds per unit power change; 0 bypasses only that signed direction.
    forward:
      increase_time: 0.22
      decrease_time: 0.55
    strafe:
      increase_time: 0.22
      decrease_time: 0.22
    turn:
      increase_time: 0.088
      decrease_time: 0.088
    max_loop_dt: 0.05
  heading_lock:
    enabled: true
    pid:
      p: 5.818074391107437
      i: 0.0
      d: 0.0
    ks: 0.0
    intent_threshold: 0.05
    ks_moving: 0.0003
    moving_speed_threshold: 10.0
    max_power: 0.30
    error_deadband_deg: 2.0
    settle_rate_dps: 15.0

  heading_tuner:
    # A lane beside the HIVE, 17 in clear of its frame: HIVE protection never acts, so trials can
    # finish. (72, 72) was inside the HIVE frame and every trial aborted. TunerPoseSafetyTest.
    calibration_pose: [20.0, 72.0, 90.0]
    step_degrees: 10.0
    maximum_sweep_degrees: 30.0
    position_drift_inches: 4.0
    heading_tolerance_degrees: 2.5
    rate_tolerance_dps: 5.0
    overshoot_limit_degrees: 3.0
    settle_sec: 0.4
    trial_timeout_sec: 4.0
    stopped_speed_ips: 1.0
    sample_period_ms: 10
    maximum_sample_gap_sec: 0.1
    p_min: 1.0
    p_max: 10.0
    p_count: 4
    d_min: 0.0
    d_max: 0.9
    d_count: 4

  jump_tuner:
    trial_axis: "FORWARD"
    rotation_trial_power: 0.2
    drive_angle_degrees: 15.0
    maximum_angle_degrees: 35.0
    angular_stop_margin_degrees: 5.0
    angular_speed_bound_dps: 180.0
    # Pinpoint pitch/roll is preferred automatically. These configure the fallback only.
    imu_name: "imu"
    imu_logo: "RIGHT"
    imu_usb: "UP"
    # Same lane: +/- 48 in along y inside the walls. STRAFE trials start here turned 90 degrees.
    calibration_pose: [20.0, 72.0, 90.0]
    trial_power: 0.5
    max_travel_inches: 48.0
    drive_distance_inches: 16.0
    stop_margin_inches: 4.0
    reaction_time_sec: 0.05
    speed_bound_ips: 75.64281986
    baseline_sec: 0.5
    peak_hold_sec: 0.1
    settle_sec: 0.4
    stopped_speed_ips: 1.0
    baseline_rate_dps: 5.0
    jump_tilt_deg: 3.0
    jump_rate_dps: 90.0
    jump_hold_sec: 0.04
    emergency_tilt_deg: 10.0
    imu_stale_sec: 0.25
    trial_timeout_sec: 8.0
    stall_timeout_sec: 1.0
    minimum_progress_inches: 0.25
    minimum_progress_degrees: 0.5
    heading_drift_deg: 12.0
    lateral_drift_inches: 4.0
    power_tolerance: 0.01
    sample_period_ms: 10
    minimum_slew_time: 0.05
    maximum_slew_time: 0.8
    search_factor: 1.25
    candidate_count: 12



shooter:
  # false: this code's loop (kS + kV feedforward at nominal_voltage, voltage compensation, P and a
  # clamped I; FlywheelClosedLoopProperties checks it across calibration error, battery and lag).
  # The firmware PIDF (motor_pidf) oscillated: its p was 150, ~68x REV's recipe for this F.
  use_ftc_pid: false
  ks: 0.1811
  nominal_voltage: 12.0
  max_voltage_compensation: 1.4
  voltage_refresh_sec: 0.25
  # Every *_rpm value in this section is DcMotorEx.setVelocity units (encoder ticks/second).
  max_rpm: 1500
  constant_rpm: 1000
  min_transfer_threshold: 0.97
  max_velocity_threshold: 1.03
  feed_release_threshold: 0.80
  feed_intake_power: 1.0
  feed_transfer_power: 1.0
  ball_detection:
    dip_fraction: 0.09
    rebound_fraction: 0.05
    baseline_alpha: 0.03
    refractory_ms: 120
  # p = 2 kV (loop gain 2) and i = p / 2 s (2 s integral time), integrating only inside
  # integral.band_ticks. P alone (the old p = 0.3 kV) left any feedforward error almost
  # undiminished, so the wheel sat outside the 0.97-1.03 feed band whenever kS or kV was off.
  # Higher gain tolerates less sensor lag and hides ball dips; a faster integral overshoots after
  # each ball. Chosen by sweep over kS +/-50%, kV +/-20%, 11.5-13.8 V, 0-2 loops of lag.
  pidf:
    p: 0.0010125
    i: 0.00050625
    d: 0
    f: 16.5881
  # Only with use_ftc_pid: true. REV's recipe for this F: p = 0.1 F, i = 0.1 p.
  motor_pidf:
    p: 2.204
    i: 0.2204
    d: 0
    f: 22.04
  # The integrator corrects feedforward error, so its clamp must cover the worst plausible error:
  # kS 50% off plus kV 20% off at max_shot_rpm is ~0.24 power. 0.15 left the wheel just over the
  # feed band in that corner.
  integral:
    band_ticks: 150.0
    max_contribution: 0.25
  # Recovery kick (utilities/FlywheelKick): once the wheel reads kick_trigger_fraction below target
  # (a ball, or spin-up), the most power the wheel model (kS, kV, the integrator's correction,
  # wheel_tau_sec) allows without passing target next loop, until the speed predicted over
  # sensor_lag_sec reaches min_transfer_threshold. With the model configured, P also acts on that
  # predicted speed. No gain to tune: both times come from Shooter Characterization's step test.
  # wheel_tau_sec 0 disables the kick and the prediction (the loop above, unchanged).
  kick:
    wheel_tau_sec: 0.0
    sensor_lag_sec: 0.0
    kick_lag_margin_sec: 0.0075
    kick_trigger_fraction: 0.09
    kick_speed_margin: 1.4
  ballistics:
    v0: 250.0
    k: 0.0012
    magnus_l: 0.015
    launch_height_inches: 15.0
    g_inches_per_sec2: 386.088
    min_hood_angle_deg: 15.0
    max_hood_angle_deg: 65.0
    min_hood_servo_pos: 0.85
    max_hood_servo_pos: 0.0
    # Steep lobs fly ~0.6-0.8 s, so lead grows fast with speed; start conservative.
    max_moving_speed_ips: 20.0
    min_valid_distance: 24.0
    max_valid_distance: 72.0
    max_off_axis_deg: 60.0
    lead_bias_gain: 1.0
    v0_reference_rpm: 1000.0
    preferred_shot_rpm: 800.0
    max_shot_rpm: 1450.0
    v0_margin_fraction: 0.12
    rpm_update_deadband: 25.0
    # Lob flight time ~ base + per_inch * range; seeded from a launch model (0.63 s at 24 in,
    # 0.80 s at 60 in). Only used to lead moving shots.
    flight_time_base_sec: 0.51
    flight_time_sec_per_inch: 0.0049
    lead_min_speed_ips: 10.0
  shot_table:
    # PLACEHOLDER rows seeded from a launch model for the CELL opening (59.6 in up), not
    # measured. While calibrated is false the automatic feed gate refuses to fire; run the
    # Ballistics Calibration OpMode for each SCORING ELEMENT, paste its rows, then set true.
    calibrated: false
    # This robot cannot intake or launch NECTAR (3.6 in), so only the POLLEN table is used.
    # The NECTAR rows below stay in place for a future mechanism; set true to allow selecting them.
    nectar_enabled: false
    # distance_in, hood_servo, flywheel ticks/s
    pollen_points: [
        24.0, 0.0000, 800.0,
        36.0, 0.0000, 840.0,
        48.0, 0.0500, 880.0,
        60.0, 0.1000, 925.0,
        72.0, 0.1500, 970.0
      ]
    nectar_points: [
        24.0, 0.0000, 880.0,
        36.0, 0.0000, 925.0,
        48.0, 0.0500, 970.0,
        60.0, 0.1000, 1020.0,
        72.0, 0.1500, 1070.0
      ]

auto:
  # distance_in, shoot_window_ms pairs written by the Shot Timing Tuner. PLACEHOLDER.
  shot_time_points: [
      24.0, 2200,
      72.0, 3000
    ]
  shoot_wait_ms: 2500
  balls_per_volley_count: 4
  tip_wait_ms: 2500
  collect_dwell_ms: 1200
  # Park deadline: AUTO stops the routine and parks once the time left is no more than the estimated
  # drive to park (stopping from the current speed, then the route around the HIVE) plus
  # park_margin_ms, and never later than park_reserve_ms before the end. Re-estimated every
  # park_update_ms. The estimate is deliberately slow (strafe top speed, a settle per corner).
  park_margin_ms: 2500
  park_reserve_ms: 3000
  park_update_ms: 250
  transfer_power: 0.12
  # This robot cannot take POLLEN from a FLOWER, so neither routine refills. CELL A still drives
  # the FLOWER-side lane around the HIVE (without stopping) to fire any POLLEN left after the TIP
  # into CELL B.
  cell_a_collect_flower: false
  cell_a_second_volley: true
  cell_b_collect_flower: false

teleop:
  max_speed: 1
  field_centric: false
  field_centric_offset_deg: 0
  intake_power: 1.0
  transfer_power: 0.1
  manual_rev_power: 0.6
  eject_power: -0.6
  # Driver dpad left drives to and holds poses.<alliance>.flower. Off: this robot has no FLOWER
  # pickup.
  flower_hold_enabled: false
  rumble_ms: 600
  # Park alert, from match.final_warning_remaining_ms on: once the time left is no more than the
  # estimated drive to the park pose plus this margin, rumble, speak and flash until parked.
  park_alert_margin_ms: 4000
  park_alert_update_ms: 250
  park_alert_repeat_ms: 1000
  poses:
    red:
      start: [58.0, 9.0, 90]
      park: [16.0, 99.0, 90]
      shoot_a: [58.0, 27.0, 90]
      shoot_b: [58.0, 114.0, 270]
      flower: [16.0, 47.36, 180]
    blue:
      start: m
      park: m
      shoot_a: m
      shoot_b: m
      flower: m

# Autonomous routines. CELL A is the alliance's CELL that starts upward-facing (RED audience
# CELL, BLUE rear CELL); CELL B is the other CELL of the same HIVE. Blue poses are the 180-degree
# rotation of red about the field centre.
auto_poses:
  cell_a:
    red:
      start: [58.0, 9.0, 90]
      score_a: [58.0, 27.0, 90]
      flower: [16.0, 47.36, 180]
      score_b_cp: [16.0, 100.0, 0]
      score_b: [36.0, 106.0, 318.36]
      park: [16.0, 99.0, 90]
    blue:
      start: m
      score_a: m
      flower: m
      score_b_cp: m
      score_b: m
      park: m
  cell_b:
    red:
      start: [30.0, 132.5, 270]
      score_b_cp: [30.0, 114.0, 0]
      score_b: [58.0, 114.0, 270]
      flower: [47.36, 125.5, 90]
      alt_via: [30.0, 104.0, 0]
      alt_a: [32.0, 33.0, 40.31]
      park: [16.0, 119.5, 270]
    blue:
      start: m
      score_b_cp: m
      score_b: m
      flower: m
      alt_via: m
      alt_a: m
      park: m
  park_only:
    red:
      start: [9.0, 75.0, 0]
      park: [16.0, 99.0, 0]
    blue:
      start: m
      park: m

# Agent bridge: HTTP endpoints under /agent/ on the Robot Controller's web server (port 8080)
# for the laptop MCP server in tools/robot-mcp. It records hardware and OpMode telemetry, plays
# gamepad scripts into the running OpMode, inits/starts/stops OpModes and sets config values in
# memory. It never writes an actuator: OpModes still own every motor and servo.
agent_bridge:
  # Off: every endpoint except /agent/status answers 403. Turn off before competitions.
  bridge_enabled: true
  # Independent hardware sampling: one bulk read per hub per sample, sent as its own command so
  # the OpMode's bulk cache is never cleared or replaced.
  record_rate_hz: 50
  # 30000 rows is 10 minutes at 50 Hz; samples past it are dropped and the run is marked full.
  record_max_rows: 30000
  # Motor currents cost one hub command per motor, so they are read every Nth sample (0: never).
  current_every_n_samples: 10
  telemetry_buffer_entries: 2000
  # Longest gamepad script the bridge accepts, and how often a running script is advanced (its
  # timing resolution).
  max_script_ms: 120000
  script_tick_ms: 5
  # An OpMode the bridge started is stopped when no bridge request arrives for this long, so a
  # stalled agent cannot leave a mechanism running. 0 disables.
  deadman_ms: 30000
  # Flight recorder: one row per change in what the OpMode read (each new hub bulk read, each
  # Pinpoint update), taken from the SDK's caches, so it adds no hub traffic. Written to
  # /sdcard/FIRST/flight/<time>-<label>/ while it runs. Started by the agent (flight_record) or,
  # with flight_auto, for every OpMode run.
  flight_auto: false
  # How often the caches are checked for a new read; above the OpMode's loop rate.
  flight_poll_hz: 500
  # How often rows reach the file (the most a robot-app crash can lose).
  flight_flush_ms: 500
  # 200000 rows is about 17 minutes at a 200 Hz loop; later rows are dropped and the flight
  # marked truncated.
  flight_max_rows: 200000
  # Flights kept on the robot; older ones are deleted when a new one starts.
  flight_keep: 30
