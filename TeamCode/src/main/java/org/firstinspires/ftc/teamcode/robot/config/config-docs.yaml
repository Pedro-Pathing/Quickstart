x_pod_offset:
  desc: "Forward odometry pod offset in inches, recovered from local Pedro 3 tuning."

y_pod_offset:
  desc: "Strafe odometry pod offset in inches, recovered from local Pedro 3 tuning."

pid:
  desc: "Heading feedback PID coefficients, bound as SDK PIDFCoefficients. Current Pedro 3 tuning is proportional-only: keep I and D at zero unless separately tuned."

small_error_pid:
  desc: "Translation PID coefficients below gain_threshold, bound as SDK PIDFCoefficients. Recovered Pedro 3 tuning uses only P; I and D are zero."

large_error_pid:
  desc: "Translation PID coefficients at or above gain_threshold, bound as SDK PIDFCoefficients. Recovered Pedro 3 tuning uses only P; I and D are zero."

p:
  desc: "Proportional feedback gain for this controller."
  min: 0.0

i:
  desc: "Integral feedback gain for this controller."
  min: 0.0

d:
  desc: "Derivative feedback gain for this controller."
  min: 0.0

ks:
  desc: "Static friction feedforward magnitude. Pedro heading uses zero with the recovered proportional-only tuning; separate from PID feedback."
  min: 0.0
  max: 1.0

gain_threshold:
  desc: "Absolute translation error in inches at which each axis switches to its large-error PID gains."
  min: 0.0

coast_kv:
  desc: "Foresight coast feedforward gain recovered from local Pedro 3 tuning."
  min: 0.0

brake_kv:
  desc: "Foresight brake feedforward gain recovered from local Pedro 3 tuning."
  min: 0.0

linear:
  desc: "Linear coefficient in Foresight stopping displacement: linear * velocity + quadratic * velocity * abs(velocity). Translation uses inches and heading uses radians."

quadratic:
  desc: "Quadratic coefficient in Foresight stopping displacement: linear * velocity + quadratic * velocity * abs(velocity). Translation uses inches and heading uses radians."

max_forward_velocity:
  desc: "Forward velocity in inches per second recovered verbatim from local tuning; unusually low, verify on robot."
  min: 0.0

max_strafe_velocity:
  desc: "Strafe velocity in inches per second recovered from local Pedro 3 tuning."
  min: 0.0

natural_forward_deceleration:
  desc: "Foresight natural forward deceleration in inches per second squared, recovered from local Pedro 3 tuning."
  min: 0.0

natural_strafe_deceleration:
  desc: "Foresight natural strafe deceleration in inches per second squared, recovered from local Pedro 3 tuning."
  min: 0.0

max_path_speed:
  desc: "Maximum Foresight path speed as a fraction of measured top speed. Explicit speed policy, not equivalent to the old v2 path-completion threshold."
  min: 0.0
  max: 1.0

max_power_output:
  desc: "Maximum power limit (0.0 to 1.0) commanded to the turret CRServo. Limits maximum turret rotation speed."
  min: 0.0
  max: 1.0

servo_direction_inverted:
  desc: "Flips which CRServo direction counts as increasing turret angle. Set this (not the analog encoder's 'inverted' flag) when the turret drives away from its target."

ks_positive:
  desc: "Static friction feedforward (kS) magnitude applied when turning turret in positive direction (error > 0)."
  min: 0.0
  max: 1.0

ks_negative:
  desc: "Static friction feedforward (kS) magnitude applied when turning turret in negative direction (error < 0)."
  min: 0.0
  max: 1.0

min_angle:
  desc: "Most negative turret angle (degrees, relative to the chassis) the turret is allowed to reach."
  min: -180.0
  max: 0.0

max_angle:
  desc: "Most positive turret angle (degrees, relative to the chassis) the turret is allowed to reach."
  min: 0.0
  max: 180.0

full_scale_voltage:
  desc: "Full electrical span (volts) of the turret potentiometer, i.e. the voltage at which it wraps back to zero."
  min: 0.0

power_threshold:
  desc: "Commanded turret power above which the stall watchdog starts checking for motion. Below this the servo may legitimately not move, so no stall is inferred."
  min: 0.0
  max: 1.0

min_progress_deg:
  desc: "Turret motion (degrees) that counts as progress and resets the stall watchdog. Set above the analog encoder's noise floor."
  min: 0.0

timeout_sec:
  desc: "Seconds of commanded power with no turret motion before the stall watchdog latches a fault and cuts power. Protects the turret from being driven into a hard stop when the encoder reading is wrong."
  min: 0.0

divergence_deg:
  desc: "How far (degrees) the turret's aim error may grow beyond its best-so-far value before the runaway watchdog cuts power. Catches an inverted control loop, where positive power moves the turret away from its target, before it reaches a hard stop."
  min: 0.0

max_drift:
  desc: "Total lateral miss (inches) allowed at the target: the turret aim tolerance is asin((max_drift / 2) / distance), clamped to [min_deg, max_deg]. Size it from the CELL opening width seen from the shooting angle minus the ball diameter."
  min: 0.0

near_cutoff:
  desc: "Distance boundary (inches) below which the target is considered close, switching to static tolerance."
  min: 0.0

near_val:
  desc: "Target alignment tolerance (degrees) when within the near cutoff range."
  min: 0.0

min_deg:
  desc: "Minimum dynamic alignment tolerance (degrees) allowed. Prevents the turret from hunting indefinitely when very close."
  min: 0.0

max_deg:
  desc: "Maximum dynamic alignment tolerance (degrees). Caps the tolerance at short range."
  min: 0.0

logo:
  desc: "Mounting orientation direction of the hub's logo panel (e.g. RIGHT, LEFT, UP, DOWN, FORWARD, BACKWARD)."

usb:
  desc: "Mounting direction of the hub's USB ports."

robot_width:
  desc: "Total physical width of the robot (inches) used to build its square collision footprint for HIVE-frame protection, LEAVE/PARK checks and the G402 alliance-side check."
  min: 0.0

rotation_lookahead_time:
  desc: "Time horizon (seconds) used to project future rotation based on live angular velocity (|omega| * time). Seeded at 0.075s (derived from 0.45rad / assumed 6.0rad/s max omega); calibrate on robot using Friction Calibration TeleOp."
  min: 0.0

power:
  desc: "Motor power (0.0 to 1.0) commanded to push the robot back out when it is inside a protected zone (the HIVE frame). Driver/safety policy parameter."
  min: 0.0
  max: 1.0

decel_safety_factor:
  desc: "Safety margin factor (0.0 to 1.0) for predictive braking (e.g. 0.7 = 30% safety margin over physics model prediction). Risk tolerance/policy parameter."
  min: 0.0
  max: 1.0

slow_down:
  desc: "Distance (inches) from a protected zone (the HIVE frame) at which proximity speed reduction starts. Driver comfort / early-warning feel parameter."
  min: 0.0

hard_stop:
  desc: "Distance (inches) from a protected zone (the HIVE frame) where drive power toward it is cut to zero, so the robot cannot ram the HIVE (G417). Safety policy parameter."
  min: 0.0

enable_depth_protection:
  desc: "Enable/disable X-axis protection against driving into the HIVE frame. Safety policy parameter; leave true outside of debugging."

enable_side_protection:
  desc: "Enable/disable Y-axis protection against driving into the HIVE frame. Safety policy parameter; leave true outside of debugging."

lane_blend_distance:
  desc: "Distance (inches) over which safety slows downs are interpolated from 0% to 100% strength to prevent jerky speed changes."
  min: 0.0

x:
  desc: "X value coordinate."

y:
  desc: "Y value coordinate."

rot:
  desc: "Minimum turn/yaw drive power (0.0 to 1.0) needed to overcome static wheel stiction. Calibrated using Friction Calibration OpMode."
  min: 0.0
  max: 1.0
  suppress_similarity_check: true

time:
  desc: "Seconds per unit power change for Casablanca and optional Pedro slew limiting. Higher values slow power ramps; this is not an exponential filter time constant."
  min: 0.001
  suppress_similarity_check: true

enabled:
  desc: "Enable/disable this subsystem, controller, watchdog, or feature."

intent_threshold:
  desc: "Raw joystick turn threshold (0.0 to 1.0) above which driver active steering takes control and disengages heading lock."
  min: 0.0
  max: 1.0

ks_moving:
  desc: "Minimum rotational drive power (0.0 to 1.0) needed to overcome friction while the robot is already translating."
  min: 0.0
  max: 1.0

moving_speed_threshold:
  desc: "Chassis translational speed threshold (inches/sec) above which full ks_moving friction feedforward is applied."
  min: 0.0

max_power:
  desc: "Maximum motor power (0.0 to 1.0) the loop is allowed to command. Clamped to be completely imperceptible."
  min: 0.0
  max: 1.0

error_deadband_deg:
  desc: "Heading error (degrees) below which heading lock applies zero correction, to avoid chattering/jitter from sensor noise while holding a heading at rest."
  min: 0.0
  max: 15.0

settle_rate_dps:
  desc: "Rotation rate (degrees/sec) below which the robot counts as settled. Heading lock waits for this before capturing the heading to hold, so it does not latch mid-coast and fight the robot's own momentum."
  min: 0.0

use_ftc_pid:
  desc: "When true, uses the REV firmware velocity PID on the motor (RUN_USING_ENCODER with setVelocity, gains from shooter.motor_pidf). When false, uses the custom Pedro PIDF controller, anti-windup integrator, and voltage compensation (RUN_WITHOUT_ENCODER, gains from shooter.pidf)."

motor_pidf:
  desc: "REV firmware velocity PIDF (p, i, d, f) applied directly to the flywheel motors via DcMotorEx.setPIDFCoefficients when shooter.use_ftc_pid is true. Distinct from shooter.pidf, which only feeds the software PIDFController used when use_ftc_pid is false and is never sent to the motor. Keep i at 0 here: a live integral on the motor firmware winds up during a feed's velocity sag and overshoots the setpoint once the ball leaves, which is what stalled the third shot of a magazine."

max_rpm:
  desc: "Flywheel velocity (DcMotorEx.setVelocity units: encoder ticks per second, despite the historical _rpm name) that a target power of 1.0 maps to."
  min: 0.0

nominal_voltage:
  desc: "Bus voltage the flywheel feedforward (ks and pidf.f) was characterized at. Shooter.periodic() scales its motor command by nominal_voltage divided by the measured bus voltage, so a sagging pack still reaches the commanded wheel speed instead of quietly landing short and failing the feed gate. Set this to the voltage shown while the Shooter Characterization OpMode is running, not to a fresh-off-the-charger reading."
  min: 1.0
  max: 20.0

max_voltage_compensation:
  desc: "Largest factor the flywheel voltage compensation may scale its command by. Bounds the correction so a brownout or a bad voltage reading cannot rail the flywheel; 1.4 covers a 12.0 V feedforward down to about 8.6 V."
  min: 1.0
  max: 3.0

voltage_refresh_sec:
  desc: "How often the flywheel re-reads bus voltage. The hub's voltage is a separate ADC round trip rather than part of the bulk read, so polling it every loop costs milliseconds per tick; a pack does not sag meaningfully inside this interval."
  min: 0.0
  max: 5.0

min_transfer_threshold:
  desc: "Flywheel speed ratio (0.0 to 1.0) required to arm a feed. Prevents launching before the shooter is up to speed."
  min: 0.0
  max: 1.0

constant_rpm:
  desc: "Fixed flywheel target (encoder ticks/s) for manual fixed-power shots and for holding the flywheel spun up between volleys."
  min: 0.0
  max: 3000.0

band_ticks:
  desc: "Flywheel velocity error (ticks/s) within which the integral term accumulates. Outside this band the integrator holds its value, so spin-up and ball-feed transients never charge it."
  min: 0.0
  max: 2000.0

max_contribution:
  desc: "Maximum absolute motor power the flywheel integral term may contribute. Bounds windup independently of the integral gain."
  min: 0.0
  max: 1.0

v0:
  desc: "Fitted initial ring exit velocity (in/s) at constant RPM."
  min: 0.0

k:
  desc: "Fitted lumped quadratic drag coefficient (1/in) for 2D trajectory integration."
  min: 0.0

magnus_l:
  desc: "Fitted lumped Magnus lift coefficient (1/s) for 2D backspin trajectory integration."
  min: 0.0

launch_height_inches:
  desc: "Ball release height (inches) above the TILES. The target height is not configured here: it is field.hive.up_opening_height_in, the upward CELL opening centre."
  min: 0.0

g_inches_per_sec2:
  desc: "Gravitational acceleration constant (in/s²)."
  min: 0.0

min_hood_angle_deg:
  desc: "Minimum physical hood elevation angle (degrees)."
  min: 0.0
  max: 90.0

max_hood_angle_deg:
  desc: "Maximum physical hood elevation angle (degrees)."
  min: 0.0
  max: 90.0

min_hood_servo_pos:
  desc: "Continuous servo position (0.0 to 1.0) corresponding to min_hood_angle_deg, the flattest arc. The hood linkage is reversed, so this is numerically GREATER than max_hood_servo_pos; that is expected and the angle mapping handles it. Do not 'fix' the ordering."
  min: 0.0
  max: 1.0

max_hood_servo_pos:
  desc: "Continuous servo position (0.0 to 1.0) corresponding to max_hood_angle_deg, the steepest arc. Servo 0.0 is as tall as the arc gets, so this is normally the smaller number of the pair."
  min: 0.0
  max: 1.0

max_moving_speed_ips:
  desc: "Maximum allowed robot translation speed (in/s) for valid moving shots."
  min: 0.0

min_valid_distance:
  desc: "Minimum horizontal distance (inches) from the robot to the target CELL opening centre for a valid solution."
  min: 0.0

max_valid_distance:
  desc: "Maximum horizontal distance (inches) from the robot to the target CELL opening centre for a valid solution."
  min: 0.0

lead_bias_gain:
  desc: "Empirical calibration multiplier for virtual lead target calculation."
  min: 0.0

v0_reference_rpm:
  desc: "Flywheel setpoint the fitted v0 exit velocity was measured at. Exit speed and flywheel setpoint convert through v0 / v0_reference_rpm, which is how the solver turns a required exit speed into an RPM. Must match the RPM the ballistics calibration actually ran at (constant_rpm), or every solved RPM is scaled wrong."
  min: 1.0
  max: 3000.0

preferred_shot_rpm:
  desc: "Lower bound (encoder ticks/s) the solved flywheel setpoint is clamped to. Raise it if shots land weak across the board."
  min: 0.0
  max: 3000.0

max_shot_rpm:
  desc: "Highest flywheel setpoint the RPM solver may command, for distances past the hood's authority at preferred_shot_rpm. A target that cannot reach goal height even at this speed is reported as an invalid solution instead of being silently under-shot."
  min: 0.0
  max: 3000.0

flight_time_base_sec:
  desc: "Time-of-flight intercept (seconds): a BIOBUZZ lob spends most of its flight rising ~45 in to the CELL, so flight time is base + per_inch * range rather than proportional to range. Used only to lead a moving shot."
  min: 0.0
  max: 2.0

flight_time_sec_per_inch:
  desc: "Additional time of flight per inch of horizontal range (seconds/inch), used only to lead a moving shot."
  min: 0.0
  max: 0.1

lead_min_speed_ips:
  desc: "Robot speed below which moving-shot lead is skipped entirely. A robot holding position still reports a small noisy velocity, and lead turns that noise into aim-azimuth jitter larger than the turret's settle tolerance, so the turret hunts instead of settling. Leading a nearly-stationary robot gains nothing."
  min: 0.0
  max: 100.0

v0_margin_fraction:
  desc: "Headroom above the slowest exit speed that still reaches the goal (0.12 = 12% faster), applied only to long shots that had to raise RPM past preferred_shot_rpm. Keeps those solutions off the boundary where the flat and lofted trajectory branches merge; larger values give a steeper, more forgiving entry angle at the cost of a hotter shot."
  min: 0.0
  max: 1.0

rpm_update_deadband:
  desc: "Minimum change in solved RPM (ticks/s) before the flywheel setpoint is re-commanded. Every setpoint write discards the flywheel's accumulated anti-windup integral, so without a deadband a continuously drifting target would keep the integrator reset and the flywheel permanently short of speed."
  min: 0.0

shot_time_points:
  desc: "Measured autonomous shoot windows as flat distance_in, shoot_window_ms pairs, written by the Shot Timing Tuner OpMode in exactly this format. Distances must strictly increase; interpolated and clamped at the ends. A volley ends when auto.balls_per_volley_count balls are counted OR this window expires; the window is the jam safety net. auto.shoot_wait_ms is the fallback when this table is empty."

shoot_wait_ms:
  desc: "Fallback autonomous shoot window (milliseconds), used only when auto.shot_time_points is empty."
  min: 0

transfer_power:
  desc: "Transfer motor power (0.0 to 1.0) while the intake is collecting (not feeding the shooter)."
  min: 0.0
  max: 1.0

start:
  desc: "Starting pose: touching the perimeter wall, fully on the alliance's side, not in the LOADING ZONE and not touching a FLOWER (G304)."

park:
  desc: "Parking pose: footprint partially inside the alliance LOADING ZONE but clear of the perimeter wall, so the robot earns both LEAVE and PARK at the end of AUTO."

max_speed:
  desc: "Maximum speed scaler (0.0 to 1.0) applied to chassis manual TeleOp drive inputs."
  min: 0.0
  max: 1.0

field_centric:
  desc: "When true, driver translation sticks are interpreted in the field frame (stick direction is a fixed field direction regardless of robot heading). When false, sticks are robot-relative."

field_centric_offset_deg:
  desc: "Field heading (degrees) that a fully-forward driver stick should drive toward when field_centric is true. 90 means stick-forward drives along field +Y, i.e. away from the driver wall at y=0. Set this to whatever direction is 'away' from where the drivers physically stand."
  min: -360.0
  max: 360.0

zero_voltage:
  desc: "Analog voltage (V) corresponding to 0 degree turret angle position."
  min: 0.0
  max: 3.3

degrees_per_volt:
  desc: "Scale factor (degrees/volt) converting analog input voltage delta to turret angle in degrees."

min_voltage:
  desc: "Minimum safe voltage limit for the analog encoder."
  min: 0.0
  max: 3.3

max_voltage:
  desc: "Maximum safe voltage limit for the analog encoder."
  min: 0.0
  max: 3.3

inverted:
  desc: "True if increasing turret angle produces decreasing analog voltage."

max_velocity_threshold:
  desc: "Flywheel velocity upper bound ratio (e.g. 1.03) to prevent overshooting before a feed is armed. Applies only when arming, not while a feed is running, since a ball can only slow the flywheel down."
  min: 1.0
  max: 2.0

feed_release_threshold:
  desc: "Fraction of target flywheel speed a feed already in progress may sag to before the intake cuts out. Must be below min_transfer_threshold: it is the lower half of a hysteresis band, so each ring entering the flywheel does not drop the speed under the arming floor and stutter the intake off and back on. Raise it toward min_transfer_threshold for stricter shot energy, lower it if the intake still hitches while feeding."
  min: 0.0
  max: 1.0

feed_intake_power:
  desc: "Front intake power (0.0 to 1.0) when feeding SCORING ELEMENTS to the shooter."
  min: 0.0
  max: 1.0

feed_transfer_power:
  desc: "Transfer motor power (0.0 to 1.0) when feeding SCORING ELEMENTS to the shooter."
  min: 0.0
  max: 1.0

dip_fraction:
  desc: "How far flywheel speed must fall below its running reference, as a fraction, to count as a ball leaving the shooter. Measured on this robot: real balls dip 12.2%-26.4%, the deepest non-ball (the wheel coasting down after a shot) reaches 5.4%. Keep this between them; see FlywheelDipDetector."
  min: 0.0
  max: 1.0

rebound_fraction:
  desc: "How far flywheel speed must climb back up off a dip's own trough, as a fraction, before the next ball can register. Must be strictly below dip_fraction. Ending a dip on a rebound off the trough — not on a return to the pre-ball reference — is what lets balls that arrive close together each get counted; see FlywheelDipDetector."
  min: 0.0
  max: 1.0

baseline_alpha:
  desc: "EMA weight per control loop for the ball detector's running reference speed. Small enough that one ball cannot drag the reference down with it, large enough to track a flywheel settling into a new cruise speed between shots."
  min: 0.0
  max: 1.0

refractory_ms:
  desc: "Minimum spacing (milliseconds) between counted ball events. One ball produces a dip with a ragged floor; without this, noise on the way back up would count as a second ball."
  min: 0

intake_power:
  desc: "Target motor power (0.0 to 1.0) for the intake rollers in TeleOp."
  min: 0.0
  max: 1.0
  suppress_similarity_check: true

manual_rev_power:
  desc: "Target flywheel power ratio (0.0 to 1.0) for manual rev command in TeleOp."
  min: 0.0
  max: 1.0

max_loop_dt:
  desc: "Maximum elapsed seconds used by the shared slew limiter per update; prevents a large power step after a stalled loop."
  min: 0.001
  max: 0.2

imu_name:
  desc: Hardware-map name of the Control Hub IMU used when Pinpoint firmware lacks pitch/roll.
    Defaults to the FTC built-in IMU name. Pinpoint firmware 3 or newer is preferred automatically.
imu_logo:
  desc: REV IMU logo-facing direction for the jump tuner; must match the physical
    mounting.
imu_usb:
  desc: REV IMU USB-facing direction for the jump tuner; must match the physical mounting.
calibration_pose:
  desc: Actual field starting pose [x inches, y inches, heading degrees] for every
    manually repositioned tuning trial; STRAFE trials start here turned 90 degrees.
    Collision protection uses this pose, so it must leave HIVE protection inactive over
    the whole trial (TunerPoseSafetyTest checks).
trial_power:
  desc: Requested forward/reverse input power for jump tuning, before Casablanca friction
    compensation. Results are validated only at this power.
  min: 0.01
  max: 1.0
max_travel_inches:
  desc: Maximum measured cumulative travel per trial, including stopping. Power is
    removed earlier using a stopping reserve. The tuner rejects values above the requested
    48-inch ceiling.
  min: 1.0
  max: 48.0
drive_distance_inches:
  desc: Maximum powered travel before requesting a ramped stop; total travel including
    stopping remains subject to max_travel_inches.
  min: 0.1
  max: 48.0
stop_margin_inches:
  desc: Unpowered stopping reserve in inches inside the per-trial traversal limit.
  min: 0.1
  max: 24.0
reaction_time_sec:
  desc: Loop/sensor reaction-time allowance used in jump-tuning stopping-room prediction.
  min: 0.001
  max: 1.0
speed_bound_ips:
  desc: Conservative forward speed estimate at full power used by jump-tuning stopping-room
    prediction; seeded from the prior 75.6428 in/s measurement.
  min: 0.1
baseline_sec:
  desc: Stationary IMU baseline duration before each jump-tuning trial.
  min: 0.1
  max: 5.0
peak_hold_sec:
  desc: Required duration at the requested trial power before a passing trial can
    certify a setting.
  min: 0.01
  max: 1.0
settle_sec:
  desc: Stationary observation time after stopping; includes delayed chassis rocking
    in the jump result.
  min: 0.1
  max: 3.0
stopped_speed_ips:
  desc: Linear velocity magnitude below which a jump-tuning trial is considered stationary.
  min: 0.01
  max: 5.0
baseline_rate_dps:
  desc: Maximum pitch/roll angular-rate magnitude while taking the stationary baseline.
  min: 0.1
  max: 30.0
jump_tilt_deg:
  desc: Diagnostic combined chassis tilt threshold. Does not establish 4-bar pod contact
    or reject a contact-confirmed trial.
  min: 0.1
  max: 20.0
jump_rate_dps:
  desc: Diagnostic combined pitch/roll rate threshold. Pod contact is confirmed by the observer.
  min: 1.0
  max: 500.0
jump_hold_sec:
  desc: Duration for the diagnostic tilt/rate indicator; pod contact verdict comes from the observer.
  min: 0.001
  max: 1.0
emergency_tilt_deg:
  desc: Baseline-relative tilt that aborts the trial immediately; must exceed jump_tilt_deg.
  min: 0.2
  max: 30.0
imu_stale_sec:
  desc: Maximum time without a new IMU orientation sample before aborting the trial.
  min: 0.01
  max: 1.0
trial_timeout_sec:
  desc: Maximum duration of one jump-tuning trial including baseline and settling.
  min: 0.5
  max: 30.0
stall_timeout_sec:
  desc: Maximum time without measurable travel while drive power is requested.
  min: 0.1
  max: 5.0
minimum_progress_inches:
  desc: Travel increment that refreshes the jump-tuner stall watchdog.
  min: 0.01
  max: 2.0
heading_drift_deg:
  desc: Maximum heading deviation from the trial start before aborting.
  min: 0.1
  max: 45.0
lateral_drift_inches:
  desc: Maximum sideways deviation from the straight calibration lane before aborting.
  min: 0.1
  max: 12.0
power_tolerance:
  desc: Allowed difference from the requested power when checking trial excitation
    and zero output.
  min: 0.0001
  max: 0.1
sample_period_ms:
  desc: Delay between jump-tuner control-loop updates, in milliseconds.
  min: 1
  max: 50
minimum_slew_time:
  suppress_similarity_check: true
  desc: Fastest nonzero directional slew time tested after an unrestricted contact trial fails.
  min: 0.001
  max: 2.0
maximum_slew_time:
  suppress_similarity_check: true
  desc: Slowest directional slew time considered when finding a contact-confirmed baseline.
  min: 0.001
  max: 3.0
search_factor:
  desc: Multiplicative step between candidate slew settings; must exceed one.
  min: 1.01
  max: 2.0
candidate_count:
  desc: Maximum number of candidate settings evaluated; a pass requires both forward
    and reverse trials.
  min: 1
  max: 50

teleop_enabled:
  desc: Apply directional power slew to Casablanca TeleOp input. Per-instance commands may override it.
auto_enabled:
  desc: Apply directional slew to Pedro FOLLOW/HOLD output. False preserves native autonomous output independently
    of TeleOp.
increase_time:
  desc: Seconds per unit increase in signed robot-axis power; 0 is unrestricted. Includes acceleration in the positive
    direction and braking from negative power. Tune pod contact for each axis.
  min: 0
  suppress_similarity_check: true
decrease_time:
  desc: Seconds per unit decrease in signed robot-axis power; 0 is unrestricted. Includes braking from positive
    power and acceleration in the negative direction.
  min: 0
  suppress_similarity_check: true
trial_axis:
  desc: 'Pod contact tuning axis: FORWARD, STRAFE, or TURN. Results apply only to that axis and tested power; mixed
    inputs need robot validation.'
rotation_trial_power:
  desc: Requested yaw input for TURN pod contact trials, before friction compensation.
  min: 0.01
  max: 1
drive_angle_degrees:
  desc: Powered angular travel before requesting a ramped stop during a TURN pod contact trial.
  min: 1
  max: 90
maximum_angle_degrees:
  desc: Angular travel budget including stopping during a TURN pod contact trial.
  min: 1
  max: 180
angular_stop_margin_degrees:
  desc: Angular braking reserve within the TURN trial travel budget.
  min: 0.1
  max: 45
angular_speed_bound_dps:
  desc: Conservative full-power yaw speed bound for TURN trial braking prediction, degrees per second.
  min: 1
step_degrees:
  desc: Signed heading step magnitude in each direction for TeleOp heading-lock tuning.
  min: 1
  max: 45
maximum_sweep_degrees:
  desc: Maximum deviation from each heading trial starting angle before an immediate stop.
  min: 1
  max: 90
position_drift_inches:
  desc: Maximum translation during an in-place heading trial before aborting.
  min: 0.1
  max: 12
heading_tolerance_degrees:
  desc: Required heading settling tolerance; must be at least the TeleOp heading-lock deadband.
  min: 0.1
  max: 10
rate_tolerance_dps:
  desc: Maximum absolute yaw rate for settled heading measurements.
  min: 0.1
  max: 30
overshoot_limit_degrees:
  desc: Reject heading gains whose measured overshoot exceeds this limit.
  min: 0.1
  max: 20
maximum_sample_gap_sec:
  desc: Abort a heading trial after a control-loop delay above this duration.
  min: 0.01
  max: 0.5
p_min:
  desc: Lowest P gain tested by the TeleOp heading-lock step-response tuner (radians).
  min: 0
  suppress_similarity_check: true
p_max:
  desc: Highest P gain tested by the TeleOp heading-lock step-response tuner (radians).
  min: 0
  suppress_similarity_check: true
p_count:
  desc: Number of evenly spaced P candidates; 1 tests p_min only.
  min: 1
  max: 10
  suppress_similarity_check: true
d_min:
  desc: Lowest D gain tested by the TeleOp heading-lock tuner using measured yaw rate.
  min: 0
  suppress_similarity_check: true
d_max:
  desc: Highest D gain tested by the TeleOp heading-lock tuner using measured yaw rate.
  min: 0
  suppress_similarity_check: true
d_count:
  desc: Number of evenly spaced D candidates; 1 tests d_min only.
  min: 1
  max: 10
  suppress_similarity_check: true

minimum_progress_degrees:
  desc: Angular travel that refreshes the TURN pod-contact trial stall watchdog.
  min: 0.1
  max: 10.0

# --- BIOBUZZ ---

season:
  desc: "Season tag. ConfigLoader ignores an ADB-pushed override whose meta.season differs from (or lacks) this value, so last season's pushed config can never override this season's bundled values."

size_in:
  desc: "Inside-wall field width (inches). The field centre is size_in / 2; BLUE geometry and every 'm' pose are the 180-degree rotation of RED about it. Manual nominal 144, official CAD ~141.3."
  min: 120.0
  max: 150.0

center_to_center_in:
  desc: "Horizontal distance (inches) between the RED and BLUE HIVE pivots, along x (manual Figure 9-10)."
  min: 0.0

pivot_height_in:
  desc: "HIVE pivot height above the TILES (inches, manual Figure 9-8)."
  min: 0.0

up_opening_offset_in:
  desc: "Horizontal distance (inches) from the HIVE pivot to an upward-facing CELL's opening centre, toward the side the opening faces (CAD-derived). This point is the SDK AprilTag cluster origin and the shot target."
  min: 0.0

up_opening_height_in:
  desc: "Height (inches) of an upward-facing CELL's opening centre above the TILES (manual: opening spans 53.5-65.6 in)."
  min: 0.0

down_opening_offset_in:
  desc: "Horizontal distance (inches) from the HIVE pivot to a downward-facing CELL's opening centre (the up geometry rotated 60 degrees about the pivot)."
  min: 0.0

down_opening_height_in:
  desc: "Height (inches) of a downward-facing CELL's opening centre above the TILES."
  min: 0.0

frame_width_in:
  desc: "HIVE frame base width (inches) along x (manual Figure 9-8)."
  min: 0.0

frame_depth_in:
  desc: "HIVE frame base depth (inches) along y (manual Figure 9-8)."
  min: 0.0

bottom_height_in:
  desc: "Lowest HIVE point above the TILES (inches). TU05 corrected V1's 25.5 in typo to 30.6 in; a robot must stay below this to pass under the HIVE."
  min: 0.0

start_y_in:
  desc: "RED LOADING ZONE start along the RED alliance wall (inches from the audience wall). BLUE is the 180-degree rotation."
  min: 0.0

width_in:
  desc: "LOADING ZONE length along its wall (inches, manual: ~23 in)."
  min: 0.0

depth_in:
  desc: "Depth of a zone measured out from its wall (inches): LOADING ZONE ~11 in."
  min: 0.0

length_in:
  desc: "GARDEN length along the audience/rear wall from the alliance corner (inches, manual: ~23 in)."
  min: 0.0

wall_offset_in:
  desc: "Distance (inches) from a FLOWER's top-ring centre to the perimeter wall it is mounted on (official field CAD: 2.65)."
  min: 0.0

corner_offset_in:
  desc: "Distance (inches) from the alliance corner to each alliance-side FLOWER along its wall (official field CAD: 23.39 in from the field centre line)."
  min: 0.0

up_height_threshold_in:
  desc: "A detected CELL whose opening centre is above this height (inches) is classified upward-facing. Upward openings sit at ~59.6 in and downward ones at ~38.2 in."
  min: 0.0

confirm_frames_count:
  desc: "Consecutive agreeing AprilTag observations required before the HIVE tracker accepts a TIP it did not already expect."
  min: 1

settle_ms:
  desc: "After a TIP is detected or entered, feeding is locked out for this long while the HIVE swings and spilled SCORING ELEMENTS clear (manual 10.5.1: launching into a tipping HIVE can stop the TIP)."
  min: 0

max_observation_age_ms:
  desc: "AprilTag CELL observations older than this (milliseconds) are ignored by the HIVE tracker."
  min: 0

auto_ms:
  desc: "Length of AUTO (milliseconds, manual 10.4)."
  min: 0

teleop_ms:
  desc: "Length of TELEOP (milliseconds, manual 10.4)."
  min: 0

flower_unlock_remaining_ms:
  desc: "TELEOP time remaining (milliseconds) at which NECTAR may enter FLOWERS (G410) and humans may enter all remaining NECTAR (G426)."
  min: 0

final_warning_remaining_ms:
  desc: "TELEOP time remaining (milliseconds) at which the park alert starts estimating the drive to the park pose. Nothing is signalled at this moment; the alert fires later, at park_alert_margin_ms before the estimated last moment."
  min: 0

capacity_count:
  desc: "Maximum SCORING ELEMENTS the robot may CONTROL (G407: 4). The intake stops itself when the tracked inventory reaches this."
  min: 1
  max: 4

preload_count:
  desc: "SCORING ELEMENTS loaded at match start (manual 10.3.4: exactly 4 POLLEN)."
  min: 0
  max: 4

entry_sensor_enabled:
  desc: "True when an intake-entry beam break / proximity sensor is fitted. Without it the inventory count is unknown in TELEOP and the intake cannot cap itself at capacity_count."

entry_sensor_name:
  desc: "Robot configuration name of the intake-entry DigitalChannel sensor."

entry_sensor_active_low:
  desc: "True if the entry sensor reads false while a SCORING ELEMENT blocks it (most beam breaks)."

entry_debounce_ms:
  desc: "Minimum time (milliseconds) the entry sensor must stay blocked before a SCORING ELEMENT is counted."
  min: 0

continuous:
  desc: "Stream the camera continuously so the HIVE tracker sees every TIP. False streams only while the operator holds relocalize."

camera_name:
  desc: "Robot configuration name of the webcam."

decimation:
  desc: "AprilTag decimation. Higher is faster with shorter detection range."
  min: 1.0
  max: 6.0

forward_in:
  desc: "Camera lens position forward of the robot centre (inches)."

left_in:
  desc: "Camera lens position left of the robot centre (inches)."

height_in:
  desc: "Camera lens height above the TILES (inches)."
  min: 0.0

yaw_deg:
  desc: "Camera yaw (degrees) from robot forward, counter-clockwise positive."
  min: -180.0
  max: 180.0
  suppress_similarity_check: true

pitch_up_deg:
  desc: "Camera pitch (degrees) above horizontal. BIOBUZZ tags are on CELL bottoms 30-60 in up, so this is positive."
  min: -90.0
  max: 90.0

max_range_in:
  desc: "Ignore CELL detections farther than this (inches) for relocalization; pose error grows with range."
  min: 0.0

max_correction_in:
  desc: "Reject a vision relocalization that moves the pose farther than this (inches) from odometry; that is a misidentified or moving CELL, not drift."
  min: 0.0

protect_full_hive_footprint:
  desc: "True protects the whole HIVE frame base rectangle (the robot never drives under the HIVE). False protects only the two 2 in frame foot bars, for a robot built to pass under the HIVE; the inward-leaning A-frame legs are not modelled, so verify leg clearance for the robot's height."

frame_base_width_in:
  desc: "Width (inches) of each triangular HIVE frame base rail, used when protect_full_hive_footprint is false."
  min: 0.0

center_line_margin_in:
  desc: "Margin (inches) the robot footprint must keep from the field centre line to count as fully on its own side (G304.A / G402)."
  min: 0.0

max_off_axis_deg:
  desc: "Largest angle (degrees) between the target CELL opening's outward direction and the line to the robot for a valid shot. The opening faces outward and 30 degrees up, so shots from behind or far to the side cannot enter it."
  min: 0.0
  max: 90.0

calibrated:
  desc: "False marks the shot tables as placeholders: the automatic feed gate refuses to fire. Set true only after the Ballistics Calibration OpMode has produced real BIOBUZZ rows."

pollen_points:
  desc: "POLLEN shot table as flat distance_in, hood_servo, flywheel_ticks_per_sec triples from the Ballistics Calibration OpMode. Distances must strictly increase."
  suppress_similarity_check: true

nectar_points:
  desc: "NECTAR shot table as flat distance_in, hood_servo, flywheel_ticks_per_sec triples. NECTAR is 3.6 in and heavier than 2.8 in POLLEN, so it needs its own calibration. Distances must strictly increase."
  suppress_similarity_check: true

balls_per_volley_count:
  desc: "SCORING ELEMENTS expected per autonomous volley. A volley ends when this many shots are counted by shooter.ball_detection or the shot window expires."
  min: 1
  max: 4

tip_wait_ms:
  desc: "Autonomous wait (milliseconds) for the target CELL to be seen upward-facing before giving up on it. The robot never launches at a downward-facing CELL (G417)."
  min: 0

collect_dwell_ms:
  desc: "Autonomous time (milliseconds) spent at a FLOWER retrieval opening with the intake running."
  min: 0

park_margin_ms:
  desc: "AUTO park deadline margin (milliseconds): the routine is cancelled and the robot parks once the time left is no more than the estimated drive to the park pose (stopping, then the HIVE-avoiding route) plus this."
  min: 0

park_reserve_ms:
  desc: "Latest AUTO park start (milliseconds before the end): the robot parks at this point even if the estimated drive plus park_margin_ms is shorter, or when no estimate exists."
  min: 0

park_update_ms:
  desc: "How often (milliseconds) AUTO re-plans the park route and re-estimates the drive time for the park deadline."
  min: 20

cell_a_collect_flower:
  desc: "CELL A routine: collect POLLEN from the alliance's side-wall FLOWER after the first volley."

cell_a_second_volley:
  desc: "CELL A routine: drive around the HIVE and launch a second volley into CELL B once it is upward-facing."

cell_b_collect_flower:
  desc: "CELL B routine: collect POLLEN from the alliance's rear-wall FLOWER and launch a second volley."
  suppress_similarity_check: true

eject_power:
  desc: "Intake power (negative = reverse) for the operator eject button, used to spit out a fifth SCORING ELEMENT (G407) or opponent NECTAR (G408)."
  min: -1.0
  max: 0.0

rumble_ms:
  desc: "Gamepad rumble length (milliseconds) for match-time cues."
  min: 0

park_alert_margin_ms:
  desc: "TELEOP park alert: fires once the time left is no more than the estimated drive to the park pose plus this many milliseconds, and repeats until the robot is PARKED."
  min: 0

park_alert_update_ms:
  desc: "How often (milliseconds) the TELEOP park alert re-plans the route and re-estimates the drive time."
  min: 20

park_alert_repeat_ms:
  desc: "Period (milliseconds) of the TELEOP park alert's rumble, gamepad light flash and Driver Station voice while it is active."
  min: 200

shoot_a:
  desc: "Pose facing CELL A's opening from the side it opens toward."
  suppress_similarity_check: true

shoot_b:
  desc: "Pose facing CELL B's opening from the side it opens toward."
  suppress_similarity_check: true

score_a:
  desc: "Autonomous volley pose for CELL A."
  suppress_similarity_check: true

score_b:
  desc: "Autonomous volley pose for CELL B."
  suppress_similarity_check: true

score_b_cp:
  desc: "Bezier control point on the path to score_b; keeps the swept footprint clear of the HIVE frame and on the alliance side."

flower:
  desc: "Pose with the intake at an alliance-side FLOWER's bottom retrieval opening (G418: POLLEN may only be removed from the bottom)."
  suppress_similarity_check: true

alt_via:
  desc: "Waypoint on the CELL B routine's fallback route around the HIVE to alt_a."

alt_a:
  desc: "CELL B routine fallback volley pose for CELL A, used when CELL B never becomes upward-facing."
  suppress_similarity_check: true

wall_contact_tolerance_in:
  desc: "Footprint distance from a perimeter wall (inches) that counts as touching for LEAVE."
  min: 0.0
park_lane_margin_in:
  desc: "Clearance (inches) between the HIVE frame and the robot's turning radius in the emergency park lane."
  min: 0.0
route_sample_step:
  desc: "Parameter increment for autonomous and assisted-drive path safety sampling. Smaller values check more positions."
  min: 0.001
  max: 0.02

park_turn_rate_dps:
  desc: "Turn rate (degrees/second) assumed when estimating how long a park route takes. Lower is more conservative."
  min: 1.0

park_settle_per_waypoint_sec:
  desc: "Time (seconds) added per waypoint when estimating how long a park route takes, for slowing and settling at each corner."
  min: 0.0

geometry_epsilon_in:
  desc: "Numerical tolerance (inches) for footprint containment at exact field boundaries after floating-point rotation."
  min: 0.0
  max: 0.000001

kv:
  desc: "Turret velocity feedforward (power per degree/second): 1 / K, where K is the plant gain the Turret Plant Calibration OpMode reports. Drives the turret at the rate chassis rotation and translation demand, so it stops lagging the target. 0 disables."
  min: 0.0
  max: 0.1

ff_min_rate_dps:
  desc: "A settled turret follows the chassis-driven rate (kS sign(v) + kV v) only above this rate (degrees/second); slower rates are odometry noise and would make it chatter."
  min: 0.0

pivot_forward_in:
  desc: "Turret rotation axis position forward of the robot centre (inches). Aim bearings, shot distances and moving-shot lead are measured from this point."

pivot_left_in:
  desc: "Turret rotation axis position left of the robot centre (inches)."

band_deg:
  desc: "The turret I term only integrates while the aim error is within this many degrees. 30 covers the whole travel; narrow it only if the turret has symmetric, well-measured static friction compensation (a narrow band left a 3 deg stall when ks under-compensates)."
  min: 0.0

limit_power:
  desc: "Largest power (0 to 1) the turret I term may contribute."
  min: 0.0
  max: 1.0

exit_factor:
  desc: "Turret settle hysteresis: settled when the error is within tolerance, unsettled again only past tolerance * exit_factor. Stops hunting at the tolerance edge and makes the aim gate steady. 1 disables the hysteresis."
  min: 1.0
  max: 5.0

retry_after_sec:
  desc: "Seconds after a turret stall fault before power is allowed again (0 keeps the fault latched until the OpMode restarts). A ball jam or a defender holding the turret must not disable aiming for the rest of the match."
  min: 0.0
  max: 10.0
