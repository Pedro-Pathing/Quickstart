name: Tests

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  unit-tests:
    name: TeamCode unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # JDK 17: the project compiles with source/target 8, and JDK 21 emits a
      # deprecation warning for that. 17 keeps the build output clean and is
      # what AGP 8.7 targets.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # The ubuntu-latest runner ships with the Android SDK preinstalled and
      # ANDROID_HOME set, which AGP needs even for local JVM unit tests.
      - name: Run unit tests
        run: ./gradlew :TeamCode:testDebugUnitTest --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: TeamCode/build/reports/tests/testDebugUnitTest/
          retention-days: 14
