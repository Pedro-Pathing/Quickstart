[project]
name = "robot-mcp"
version = "0.1.0"
description = "MCP server for the biobuzz robot's agent bridge: OpMode control, gamepad scripts, raw hardware recording, telemetry and live config."
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.28",
]

[project.scripts]
robot-mcp = "robot_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["robot_mcp"]
